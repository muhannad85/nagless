<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat opened from a launcher inside an iframe (must NOT block)</title>
<style>
  body { font: 18px/1.6 system-ui, sans-serif; margin: 0 auto; max-width: 40em; padding: 1em; }
</style></head><body>
<h1>Chat opened from a launcher inside an iframe</h1>
<div id="content"></div>
<script>
  document.getElementById("content").innerHTML =
    Array.from({length: 34}, (_, i) => `<p>Paragraph ${i + 1}. Scroll on, reader. Nothing to see here but honest text that keeps the page tall enough to scroll comfortably on any device.</p>`).join("");
</script>
<script>
  // Support widgets write their launcher and their messenger into same-origin
  // iframes. A tap on the launcher lands in the launcher's document, so the
  // page's own listeners never see it. On a phone the messenger then fills the
  // screen and locks page scroll, showing an opaque loading screen for a
  // second first. ?nag=1 also puts up a newsletter modal for Nagless to block,
  // so the messenger can open right after a block.
  function frame(id, style, html) {
    const f = document.createElement("iframe");
    f.id = id;
    f.setAttribute("style", style);
    document.body.append(f);
    f.contentDocument.open();
    f.contentDocument.write(html);
    f.contentDocument.close();
    return f;
  }
  function openMessenger() {
    const chat = frame("chat", "position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2147483001; background: #fff;",
      `<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
        html, body { margin: 0; height: 100%; font: 15px/1.4 system-ui, sans-serif; }
        body { display: flex; flex-direction: column; }
        .loading { position: fixed; inset: 0; background: #fff; color: #555; display: grid; place-items: center; }
        header { background: #1f6feb; color: #fff; padding: 16px; font-weight: 600; }
        main { flex: 1; padding: 16px; }
        textarea { margin: 12px; height: 60px; }
      </style></head><body><div class="loading">Loading…</div></body></html>`);
    document.documentElement.style.overflow = "hidden";
    setTimeout(() => {
      chat.contentDocument.body.innerHTML = `<header>Support</header>
        <main><p>Hi there! Have a question about your order? We usually reply in a few minutes.</p></main>
        <textarea placeholder="Write a message"></textarea>`;
    }, 1000);
  }
  if (new URLSearchParams(location.search).get("nag") === "1") {
    setTimeout(() => {
      const nag = document.createElement("div");
      nag.id = "nag";
      nag.className = "newsletter-modal";
      nag.setAttribute("style", "position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center;");
      nag.innerHTML = `<form style="background: #fff; padding: 24px; border-radius: 12px;"><p>Get our newsletter</p><input type="email" placeholder="you@example.com"></form>`;
      document.body.append(nag);
    }, 500);
  }
  frame("launcher", "position: fixed; right: 16px; bottom: 16px; width: 64px; height: 64px; border: 0; z-index: 2147483000; background: transparent;",
    `<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
      html, body { margin: 0; background: transparent; }
      button { width: 64px; height: 64px; border: 0; border-radius: 50%; background: #1f6feb; color: #fff; font: 600 14px system-ui, sans-serif; }
    </style></head><body><button type="button" onclick="parent.openMessenger()">Chat</button></body></html>`);
</script>
</body></html>
