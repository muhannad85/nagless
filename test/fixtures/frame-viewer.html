<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer opened from a gallery inside an iframe (must NOT block)</title>
<style>
  body { font: 18px/1.6 system-ui, sans-serif; margin: 0 auto; max-width: 40em; padding: 1em; }
  #gallery { display: block; width: 100%; height: 130px; border: 0; }
</style></head><body>
<h1>Viewer opened from a gallery inside an iframe</h1>
<iframe id="gallery" title="Gallery"></iframe>
<div id="content"></div>
<script>
  document.getElementById("content").innerHTML =
    Array.from({length: 34}, (_, i) => `<p>Paragraph ${i + 1}. Scroll on, reader. Nothing to see here but honest text that keeps the page tall enough to scroll comfortably on any device.</p>`).join("");
</script>
<script>
  // An embedded gallery writes its thumbnails into a same-origin iframe in the
  // article. A tap on a thumbnail lands in the gallery's document, so the
  // page's own listeners never see it, and the page opens a lightbox viewer in
  // a second, full-screen frame over a 90% black layer. ?nag=1 puts up a
  // newsletter modal first for Nagless to block, so the viewer opens right
  // after a block.
  function write(f, html) {
    const doc = f.contentDocument;
    doc.open();
    doc.write(html);
    doc.close();
  }
  function openViewer() {
    const viewer = document.createElement("iframe");
    viewer.id = "viewer";
    viewer.className = "lightbox-frame";
    viewer.setAttribute("style", "position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2147483000; background: transparent;");
    document.body.append(viewer);
    write(viewer, `<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
      html, body { margin: 0; background: transparent; }
      .stage { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); display: grid; place-items: center; }
      .photo { width: 70vw; height: 50vh; background: linear-gradient(135deg, #4f46e5, #16a34a); }
      button { position: fixed; top: 12px; right: 12px; font: 600 24px system-ui, sans-serif; color: #fff; background: none; border: 0; }
    </style></head><body><div class="stage"><div class="photo"></div><button type="button" aria-label="Close">×</button></div></body></html>`);
  }
  write(document.getElementById("gallery"), `<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
      html, body { margin: 0; }
      body { display: flex; gap: 8px; }
      button { width: 120px; height: 120px; border: 0; background: linear-gradient(135deg, #4f46e5, #16a34a); color: #fff; font: 600 14px system-ui, sans-serif; }
    </style></head><body><button type="button" onclick="parent.openViewer()">Photo 1</button><button type="button" onclick="parent.openViewer()">Photo 2</button></body></html>`);
  if (new URLSearchParams(location.search).get("nag") === "1") {
    setTimeout(() => {
      const nag = document.createElement("div");
      nag.id = "nag";
      nag.className = "newsletter-modal";
      nag.setAttribute("style", "position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center;");
      nag.innerHTML = `<form style="background: #fff; padding: 24px; border-radius: 12px;"><p>Get our newsletter</p><input type="email" placeholder="you@example.com"></form>`;
      document.body.append(nag);
    }, 500);
  }
</script>
</body></html>
