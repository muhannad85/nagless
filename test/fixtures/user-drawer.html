<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User-opened slide-in drawer (must NOT block)</title>
<style>
  body { font: 18px/1.6 system-ui, sans-serif; margin: 0 auto; max-width: 40em; padding: 1em; }
  /* A shop's cart drawer: the tap starts a request, and only when it answers
     is the drawer shown just off the right edge and slid in. It finishes
     arriving over a second after the tap, with a backdrop and a lock. */
  .drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 1000; }
  .drawer { display: none; position: fixed; top: 0; right: 0; bottom: 0; width: min(85vw, 420px); background: #fff;
            z-index: 1001; padding: 24px; box-sizing: border-box; translate: 100% 0; transition: translate .4s; }
  .drawer.open { translate: 0 0; }
</style></head><body>
<h1>User-opened slide-in drawer</h1>
<button id="open-drawer" type="button">Add to cart</button>
<div id="content"></div>
<div id="backdrop" class="drawer-backdrop"></div>
<div id="nag" class="drawer">
  <h2>Your cart</h2>
  <p>1 item added.</p>
  <button type="button">Check out</button>
</div>
<script>
  document.getElementById("content").innerHTML =
    Array.from({length: 34}, (_, i) => `<p>Paragraph ${i + 1}. Scroll on, reader. Nothing to see here but honest text that keeps the page tall enough to scroll comfortably on any device.</p>`).join("");
  document.getElementById("open-drawer").addEventListener("click", () => {
    setTimeout(() => { // the add-to-cart request
      const drawer = document.getElementById("nag");
      document.documentElement.style.overflow = "hidden";
      document.getElementById("backdrop").style.display = "block";
      drawer.style.display = "block";
      requestAnimationFrame(() => requestAnimationFrame(() => drawer.classList.add("open")));
    }, 700);
  });
</script>
</body></html>
